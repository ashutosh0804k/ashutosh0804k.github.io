name: site-tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch links on other sites that break even when this site doesn't change
    - cron: "0 12 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run site tests
        run: pytest -v
